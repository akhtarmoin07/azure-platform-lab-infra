name: Terraform Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-lab
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  TF_VAR_budget_contact_emails: ${{ vars.BUDGET_CONTACT_EMAILS }}

jobs:
  plan:
    name: Plan lab infrastructure
    runs-on: ubuntu-latest
    environment: lab

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize remote backend
        working-directory: environments/lab
        run: terraform init -reconfigure -input=false

      - name: Validate configuration
        working-directory: environments/lab
        run: terraform validate -no-color

      - name: Create execution plan
        working-directory: environments/lab
        run: terraform plan -input=false -no-color
